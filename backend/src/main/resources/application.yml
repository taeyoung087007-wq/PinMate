spring:
  application:
    name: pinmate
  profiles:
    default: local
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:sqlmap/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true   # resultType=HashMap 에서 NULL 컬럼도 키를 남긴다


# 서비스 가입 코드. 비어 있으면 아무도 가입할 수 없다
pinmate:
  signup-code: ${PINMATE_SIGNUP_CODE:}

# 카카오 REST API 키 (길찾기). JavaScript 키와 다른 값. 없으면 길찾기만 실패한다
kakao:
  rest-api-key: ${KAKAO_REST_API_KEY:}

# TMAP 앱 키 (도보 길찾기). 없으면 도보 길찾기만 실패한다
tmap:
  app-key: ${TMAP_APP_KEY:}

# 공공데이터포털 인증키 Decoding 값 (실시간 버스 도착·위치). 없으면 실시간 정보만 안 나온다
tago:
  service-key: ${TAGO_SERVICE_KEY:}
