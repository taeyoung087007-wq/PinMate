spring:
  application:
    name: pinmate
  profiles:
    default: local
  # 운영 등 local 외 환경은 환경변수로 주입 (비밀값을 Git에 남기지 않기 위함)
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
