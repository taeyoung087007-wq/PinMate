spring:
  application:
    name: pinmate
  profiles:
    default: local
  config:
    import:
      - optional:file:.env[.properties]
      - optional:file:backend/.env[.properties]
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

mybatis:
  mapper-locations: classpath:sqlmap/mappers/**/*.xml
  configuration:
    map-underscore-to-camel-case: true
    call-setters-on-nulls: true   # resultType=HashMap 에서 NULL 컬럼도 키를 남긴다


# 서비스 가입 코드. 비어 있으면 아무도 가입할 수 없다
pinmate:
  signup-code: ${PINMATE_SIGNUP_CODE:}
